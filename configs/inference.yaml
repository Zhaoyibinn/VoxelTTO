# Minimal inference-only configuration for the launch.json demo_colmap path.
img_size: 518
data:
  val:
    common_config:
      augs:
        aspects: [1.0, 1.0]

model:
  _target_: vggt.models.tco.model.TCODepthAnything3
  model_name: da3-giant

  tco_steps: 20
  tco_lr: 5.0e-4
  tco_lora_rank: 4
  tco_lora_alpha: 16.0
  tco_lora_dropout: 0.0
  tco_lambda_pose: 1.0
  tco_pose_translation_weight: 1.0
  tco_lambda_intrinsics: 0.01
  tco_lambda_depth: 0.0
  tco_grad_clip: 1.0
  tco_reset_each_scene: true
  tco_gradient_checkpointing: true

  config:
    __object__:
      path: depth_anything_3.model.da3
      name: DepthAnything3Net
      args: as_params
    net:
      __object__:
        path: depth_anything_3.model.dinov2.dinov2
        name: DinoV2
        args: as_params
      name: vitg
      out_layers: [19, 27, 33, 39]
      alt_start: 13
      qknorm_start: 13
      rope_start: 13
      cat_token: true
    head:
      __object__:
        path: depth_anything_3.model.dualdpt
        name: DualDPT
        args: as_params
      dim_in: 3072
      output_dim: 2
      features: 256
      out_channels: [256, 512, 1024, 1024]
    cam_enc:
      __object__:
        path: depth_anything_3.model.cam_enc
        name: CameraEnc
        args: as_params
      dim_out: 1536
    cam_dec:
      __object__:
        path: depth_anything_3.model.cam_dec
        name: CameraDec
        args: as_params
      dim_in: 3072
    backend_dense_head:
      __object__:
        path: depth_anything_3.model.backend_dense_dpt
        name: BackendDenseDPT
        args: as_params
      dim_in: 3072
      patch_size: 14
      output_dim: 1
      activation: linear
      conf_activation: linear
      features: 256
      out_channels: [256, 512, 1024, 1024]
      pos_embed: true
      down_ratio: 1
      head_name: backend_dense
      use_sky_head: false
      norm_type: layer
    backend_gs_decoder:
      __object__:
        path: vggt.heads.voxel_gs_adapter
        name: VoxelGSAdapter
        args: as_params
      backend_out_dim: 128
      gaussian_splits: 2
      sh_degree: 2
      pred_color: false
      gaussian_scale_min: 1.0e-5
      gaussian_scale_max: 0.002
      gaussian_offset_max: 0.004
      backbone_dim: 128
      encoder_type: spunet
      geometry_hidden_dim: 256
      appearance_hidden_dim: 256
      spunet_base_channels: 32
      spunet_channels: [32, 64, 128, 256, 256, 128, 96, 96]
      spunet_layers: [2, 3, 4, 6, 2, 2, 2, 2]
      decode_chunk_size: 100000
    backend:
      __object__:
        path: vggt.models.amb3r.backend
        name: BackEnd
        args: as_params
      in_dim: 3072
      out_dim: 1024
      k_neighbors: 16
      voxel_chunk_size: 100000
    backend_option:
      high_resolution_uptimes: 14
      high_resolution_voxelsize: 0.002
      iter: 0

  gs_mode: GGGS
  infer_gs: true
  gs_from_backend: true
  use_manual_metric_scaling: true
  manual_metric_divisor: 300.0
  load_pretrained: false
